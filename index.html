<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>We're Muslim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-deep:#0F3D3E;
    --teal-mid:#1A5653;
    --paper:#F7F3E9;
    --sand:#EDE3CC;
    --gold:#C9A227;
    --gold-soft:#E4C766;
    --ink:#22302E;
    --ink-soft:#5B6C69;
    --white:#FFFDF8;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    padding-bottom:76px;
  }
  .arabic{ font-family:'Scheherazade New', serif; }
  .display{ font-family:'Amiri', serif; }

  /* ===== TOP BAR ===== */
  .topbar{
    background:var(--teal-deep);
    color:var(--white);
    padding:18px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    right:-30px; top:-30px;
    width:140px; height:140px;
    border:1px solid rgba(201,162,39,0.25);
    border-radius:50%;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; z-index:1;}
  .brand .en{ font-family:'Amiri', serif; font-size:20px; font-weight:700; letter-spacing:0.3px;}
  .brand .ar{ font-family:'Scheherazade New', serif; font-size:15px; color:var(--gold-soft); }
  .date-chip{ font-size:12px; color:rgba(255,253,248,0.75); text-align:right; z-index:1;}

  /* ===== SCREENS ===== */
  .screen{ display:none; padding:0 0 24px; animation:fadeIn 0.25s ease; }
  .screen.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ===== HERO: NEXT PRAYER ===== */
  .hero{
    margin:16px 16px 0;
    background:linear-gradient(160deg, var(--teal-deep), var(--teal-mid));
    border-radius:28px 28px 8px 8px;
    padding:26px 22px 22px;
    color:var(--white);
    position:relative;
    box-shadow:0 12px 24px -12px rgba(15,61,62,0.5);
  }
  .hero::before{
    content:"";
    position:absolute;
    top:0; left:50%; transform:translateX(-50%);
    width:60%; height:100%;
    border-radius:100% 100% 0 0 / 40% 40% 0 0;
    background:rgba(201,162,39,0.06);
    pointer-events:none;
  }
  .hero-label{ font-size:12px; color:var(--gold-soft); text-transform:none; letter-spacing:0.3px; margin-bottom:6px;}
  .hero-name{ font-family:'Amiri', serif; font-size:32px; font-weight:700; margin-bottom:4px;}
  .hero-time{ font-size:15px; color:rgba(255,253,248,0.8); margin-bottom:14px;}
  .countdown{ font-size:13px; color:var(--gold-soft); background:rgba(201,162,39,0.14); display:inline-block; padding:6px 14px; border-radius:100px; }
  .loc-row{ margin-top:14px; font-size:12px; color:rgba(255,253,248,0.6); display:flex; align-items:center; gap:6px;}

  /* ===== PRAYER LIST (arches) ===== */
  .prayer-list{ margin:18px 16px 0; display:flex; flex-direction:column; gap:10px;}
  .prayer-row{
    background:var(--white);
    border-radius:16px 16px 6px 6px;
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    border-left:3px solid var(--sand);
  }
  .prayer-row.now{ border-left:3px solid var(--gold); background:#FFFBF0;}
  .prayer-row .pname{ font-weight:600; font-size:15px; }
  .prayer-row .pname .ar{ font-family:'Scheherazade New', serif; color:var(--ink-soft); font-size:13px; margin-left:8px;}
  .prayer-row .ptime{ font-size:15px; color:var(--teal-deep); font-weight:600;}

  .section-title{ font-size:13px; color:var(--ink-soft); margin:24px 16px 10px; letter-spacing:0.2px;}

  /* ===== QIBLA SCREEN ===== */
  .qibla-wrap{ display:flex; flex-direction:column; align-items:center; padding:30px 20px 10px;}
  .compass{
    width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, #ffffff, var(--sand) 85%);
    border:6px solid var(--teal-deep);
    position:relative;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 30px -14px rgba(15,61,62,0.4);
  }
  .needle{
    position:absolute; width:6px; height:110px;
    background:linear-gradient(180deg, var(--gold), var(--teal-deep));
    border-radius:6px;
    top:50%; left:50%;
    transform-origin:50% 90%;
    transform:translate(-50%,-90%) rotate(0deg);
    transition:transform 0.3s ease-out;
  }
  .needle::after{
    content:"◆"; position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    color:var(--gold); font-size:16px;
  }
  .compass-center{ width:14px; height:14px; background:var(--teal-deep); border-radius:50%; z-index:2;}
  .qibla-info{ margin-top:22px; text-align:center;}
  .qibla-deg{ font-family:'Amiri', serif; font-size:30px; color:var(--teal-deep); font-weight:700;}
  .qibla-sub{ font-size:13px; color:var(--ink-soft); margin-top:4px; max-width:280px;}
  .qibla-btn{
    margin-top:20px; background:var(--teal-deep); color:var(--white);
    border:none; padding:12px 26px; border-radius:100px; font-size:14px; font-weight:600;
  }

  /* ===== QURAN SCREEN ===== */
  .search-bar{ margin:16px; }
  .search-bar input{
    width:100%; padding:13px 16px; border-radius:14px; border:1px solid var(--sand);
    background:var(--white); font-size:14px; font-family:'Inter',sans-serif; color:var(--ink);
  }
  .surah-list{ margin:0 16px; display:flex; flex-direction:column; gap:8px;}
  .surah-row{
    background:var(--white); border-radius:14px; padding:13px 16px;
    display:flex; align-items:center; gap:14px; cursor:pointer;
  }
  .surah-num{
    width:34px; height:34px; border-radius:10px; background:var(--sand); color:var(--teal-deep);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0;
  }
  .surah-meta{ flex:1; min-width:0;}
  .surah-name-en{ font-size:14px; font-weight:600; }
  .surah-name-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .surah-ar{ font-family:'Scheherazade New', serif; font-size:19px; color:var(--teal-deep);}

  /* Reader */
  .reader-header{
    margin:16px; display:flex; align-items:center; gap:12px;
  }
  .back-btn{
    width:36px; height:36px; border-radius:10px; background:var(--white); border:1px solid var(--sand);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--teal-deep);
  }
  .reader-title{ font-family:'Amiri', serif; font-size:18px; font-weight:700; color:var(--teal-deep);}
  .ayah-card{
    margin:0 16px 12px; background:var(--white); border-radius:16px; padding:18px;
  }
  .ayah-ar{ font-family:'Scheherazade New', serif; font-size:26px; line-height:2; text-align:right; color:var(--ink); margin-bottom:10px;}
  .ayah-en{ font-size:14px; color:var(--ink-soft); line-height:1.6;}
  .ayah-num{ font-size:11px; color:var(--gold); margin-top:8px; font-weight:600;}

  /* ===== DUA SCREEN ===== */
  .dua-tabs{ display:flex; gap:8px; margin:16px 16px 4px; overflow-x:auto; padding-bottom:4px;}
  .dua-tab{
    flex-shrink:0; padding:8px 16px; border-radius:100px; background:var(--white);
    border:1px solid var(--sand); font-size:13px; color:var(--ink-soft); white-space:nowrap;
  }
  .dua-tab.active{ background:var(--teal-deep); color:var(--white); border-color:var(--teal-deep);}
  .dua-card{
    margin:14px 16px 0; background:var(--white); border-radius:18px; padding:20px;
    border-top:2px solid var(--gold-soft);
  }
  .dua-occasion{ font-size:12px; color:var(--gold); font-weight:600; margin-bottom:10px;}
  .dua-ar{ font-family:'Scheherazade New', serif; font-size:24px; text-align:right; line-height:2; color:var(--ink); margin-bottom:12px;}
  .dua-translit{ font-size:13px; color:var(--ink-soft); font-style:italic; margin-bottom:8px; line-height:1.6;}
  .dua-en{ font-size:14px; color:var(--ink); line-height:1.6;}

  /* ===== BOTTOM NAV ===== */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--white);
    border-top:1px solid var(--sand);
    display:flex; justify-content:space-around;
    padding:10px 6px 12px;
    z-index:10;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--ink-soft); font-size:10.5px; background:none; border:none;
    padding:4px 10px;
  }
  .nav-item.active{ color:var(--teal-deep); font-weight:600;}
  .nav-icon{ font-size:19px;}

  .loading{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:14px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="en">We're Muslim</div>
    <div class="ar">نحن مسلمون</div>
  </div>
  <div class="date-chip" id="dateChip">—</div>
</div>

<!-- HOME / PRAYER TIMES -->
<div class="screen active" id="screen-home">
  <div class="hero">
    <div class="hero-label">Next prayer</div>
    <div class="hero-name" id="nextPrayerName">—</div>
    <div class="hero-time" id="nextPrayerTime">—</div>
    <div class="countdown" id="countdown">calculating…</div>
    <div class="loc-row" id="locRow">📍 finding your location…</div>
  </div>

  <div class="section-title">Today's prayers</div>
  <div class="prayer-list" id="prayerList">
    <div class="loading">Loading prayer times…</div>
  </div>
</div>

<!-- QIBLA -->
<div class="screen" id="screen-qibla">
  <div class="qibla-wrap">
    <div class="compass">
      <div class="needle" id="needle"></div>
      <div class="compass-center"></div>
    </div>
    <div class="qibla-info">
      <div class="qibla-deg" id="qiblaDeg">—°</div>
      <div class="qibla-sub" id="qiblaSub">Allow location access to find the direction to the Kaaba from where you are.</div>
      <button class="qibla-btn" id="qiblaBtn">Enable compass</button>
    </div>
  </div>
</div>

<!-- QURAN -->
<div class="screen" id="screen-quran">
  <div id="quranListView">
    <div class="search-bar">
      <input type="text" id="surahSearch" placeholder="Search a surah…">
    </div>
    <div class="surah-list" id="surahList">
      <div class="loading">Loading surahs…</div>
    </div>
  </div>
  <div id="quranReaderView" style="display:none;">
    <div class="reader-header">
      <button class="back-btn" id="readerBack">←</button>
      <div class="reader-title" id="readerTitle">—</div>
    </div>
    <div id="ayahList"><div class="loading">Loading verses…</div></div>
  </div>
</div>

<!-- DUA -->
<div class="screen" id="screen-dua">
  <div class="dua-tabs" id="duaTabs"></div>
  <div id="duaList"></div>
</div>

<div class="bottom-nav">
  <button class="nav-item active" data-screen="home"><span class="nav-icon">🕌</span>Prayer</button>
  <button class="nav-item" data-screen="qibla"><span class="nav-icon">🧭</span>Qibla</button>
  <button class="nav-item" data-screen="quran"><span class="nav-icon">📖</span>Quran</button>
  <button class="nav-item" data-screen="dua"><span class="nav-icon">🤲</span>Dua</button>
</div>

<script>
/* ================= NAVIGATION ================= */
const navItems = document.querySelectorAll('.nav-item');
const screens = document.querySelectorAll('.screen');
navItems.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    navItems.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    screens.forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-'+btn.dataset.screen).classList.add('active');
  });
});

/* ================= DATE ================= */
document.getElementById('dateChip').textContent = new Date().toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});

/* ================= LOCATION ================= */
let userLat=null, userLon=null;
function getLocation(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude, lon:pos.coords.longitude}),
      ()=>resolve(null),
      {timeout:8000}
    );
  });
}

/* ================= PRAYER TIMES ================= */
const prayerOrder = [
  {key:'Fajr', en:'Fajr', ar:'الفجر'},
  {key:'Dhuhr', en:'Dhuhr', ar:'الظهر'},
  {key:'Asr', en:'Asr', ar:'العصر'},
  {key:'Maghrib', en:'Maghrib', ar:'المغرب'},
  {key:'Isha', en:'Isha', ar:'العشاء'}
];

async function loadPrayerTimes(){
  const loc = await getLocation();
  userLat = loc ? loc.lat : 21.4225;
  userLon = loc ? loc.lon : 39.8262;
  document.getElementById('locRow').textContent = loc ? '📍 Using your current location' : '📍 Location unavailable — showing Makkah timings';

  try{
    const today = new Date();
    const dateStr = `${String(today.getDate()).padStart(2,'0')}-${String(today.getMonth()+1).padStart(2,'0')}-${today.getFullYear()}`;
    const res = await fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=${userLat}&longitude=${userLon}&method=2`);
    const data = await res.json();
    const timings = data.data.timings;
    renderPrayerList(timings);
    computeNextPrayer(timings);
  }catch(e){
    document.getElementById('prayerList').innerHTML = '<div class="loading">Couldn\'t load prayer times. Check your connection.</div>';
  }
}

function renderPrayerList(timings){
  const list = document.getElementById('prayerList');
  list.innerHTML = '';
  prayerOrder.forEach(p=>{
    const row = document.createElement('div');
    row.className = 'prayer-row';
    row.innerHTML = `<div class="pname">${p.en}<span class="ar">${p.ar}</span></div><div class="ptime">${timings[p.key]}</div>`;
    list.appendChild(row);
  });
}

function toMinutes(t){
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}

function computeNextPrayer(timings){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  let next = null;
  for(const p of prayerOrder){
    const t = timings[p.key].split(' ')[0];
    if(toMinutes(t) > nowMin){ next = {...p, time:t}; break; }
  }
  if(!next){ next = {...prayerOrder[0], time: timings.Fajr.split(' ')[0]}; }

  document.getElementById('nextPrayerName').textContent = next.en;
  document.getElementById('nextPrayerTime').textContent = next.time;

  function tick(){
    const now2 = new Date();
    const nowMin2 = now2.getHours()*60+now2.getMinutes();
    let diff = toMinutes(next.time) - nowMin2;
    if(diff < 0) diff += 24*60;
    const h = Math.floor(diff/60), m = diff%60;
    document.getElementById('countdown').textContent = `in ${h}h ${m}m`;
  }
  tick();
  setInterval(tick, 60000);

  // highlight current
  document.querySelectorAll('.prayer-row').forEach((row,i)=>{
    row.classList.toggle('now', prayerOrder[i].en === next.en);
  });
}

loadPrayerTimes();

/* ================= QIBLA ================= */
const KAABA_LAT = 21.4225, KAABA_LON = 39.8262;
function calcQiblaBearing(lat, lon){
  const toRad = d=>d*Math.PI/180, toDeg = r=>r*180/Math.PI;
  const φ1 = toRad(lat), φ2 = toRad(KAABA_LAT);
  const Δλ = toRad(KAABA_LON - lon);
  const y = Math.sin(Δλ)*Math.cos(φ2);
  const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  let brng = toDeg(Math.atan2(y,x));
  return (brng+360)%360;
}

let qiblaBearing = null;
document.getElementById('qiblaBtn').addEventListener('click', async ()=>{
  const loc = await getLocation();
  if(!loc){
    document.getElementById('qiblaSub').textContent = 'Could not access your location. Please enable location permission and try again.';
    return;
  }
  qiblaBearing = calcQiblaBearing(loc.lat, loc.lon);
  document.getElementById('qiblaDeg').textContent = Math.round(qiblaBearing)+'°';
  document.getElementById('qiblaSub').textContent = 'Point your phone flat and turn until the pointer aligns with the marked direction.';

  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    try{
      const perm = await DeviceOrientationEvent.requestPermission();
      if(perm === 'granted'){ window.addEventListener('deviceorientation', handleOrientation); }
    }catch(e){}
  } else {
    window.addEventListener('deviceorientation', handleOrientation);
  }
  document.getElementById('qiblaBtn').textContent = 'Compass active';
});

function handleOrientation(e){
  if(qiblaBearing===null) return;
  const heading = e.webkitCompassHeading !== undefined ? e.webkitCompassHeading : (360 - e.alpha);
  const rotation = qiblaBearing - heading;
  document.getElementById('needle').style.transform = `translate(-50%,-90%) rotate(${rotation}deg)`;
}

/* ================= QURAN ================= */
let surahsCache = [];
async function loadSurahs(){
  try{
    const res = await fetch('https://api.alquran.cloud/v1/surah');
    const data = await res.json();
    surahsCache = data.data;
    renderSurahList(surahsCache);
  }catch(e){
    document.getElementById('surahList').innerHTML = '<div class="loading">Couldn\'t load surah list. Check your connection.</div>';
  }
}
function renderSurahList(list){
  const el = document.getElementById('surahList');
  el.innerHTML = '';
  list.forEach(s=>{
    const row = document.createElement('div');
    row.className = 'surah-row';
    row.innerHTML = `<div class="surah-num">${s.number}</div>
      <div class="surah-meta">
        <div class="surah-name-en">${s.englishName}</div>
        <div class="surah-name-sub">${s.englishNameTranslation} · ${s.numberOfAyahs} verses</div>
      </div>
      <div class="surah-ar">${s.name}</div>`;
    row.addEventListener('click', ()=>openSurah(s));
    el.appendChild(row);
  });
}
document.getElementById('surahSearch').addEventListener('input', (e)=>{
  const q = e.target.value.toLowerCase();
  renderSurahList(surahsCache.filter(s=>s.englishName.toLowerCase().includes(q) || s.englishNameTranslation.toLowerCase().includes(q)));
});

async function openSurah(s){
  document.getElementById('quranListView').style.display='none';
  document.getElementById('quranReaderView').style.display='block';
  document.getElementById('readerTitle').textContent = s.englishName + ' · ' + s.name;
  document.getElementById('ayahList').innerHTML = '<div class="loading">Loading verses…</div>';
  try{
    const [arRes, enRes] = await Promise.all([
      fetch(`https://api.alquran.cloud/v1/surah/${s.number}`),
      fetch(`https://api.alquran.cloud/v1/surah/${s.number}/en.asad`)
    ]);
    const arData = await arRes.json();
    const enData = await enRes.json();
    const ayahs = arData.data.ayahs;
    const ayahsEn = enData.data.ayahs;
    const container = document.getElementById('ayahList');
    container.innerHTML = '';
    ayahs.forEach((a,i)=>{
      const card = document.createElement('div');
      card.className = 'ayah-card';
      card.innerHTML = `<div class="ayah-ar">${a.text}</div>
        <div class="ayah-en">${ayahsEn[i] ? ayahsEn[i].text : ''}</div>
        <div class="ayah-num">Ayah ${a.numberInSurah}</div>`;
      container.appendChild(card);
    });
  }catch(e){
    document.getElementById('ayahList').innerHTML = '<div class="loading">Couldn\'t load this surah. Check your connection.</div>';
  }
}
document.getElementById('readerBack').addEventListener('click', ()=>{
  document.getElementById('quranReaderView').style.display='none';
  document.getElementById('quranListView').style.display='block';
});
loadSurahs();

/* ================= DUA / HADITH ================= */
const duaData = {
  daily: [
    {occasion:'Waking up', ar:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ', translit:'Alhamdu lillahil-ladhi ahyana ba\'da ma amatana wa ilayhin-nushur', en:'All praise is for Allah who gave us life after having taken it from us, and unto Him is the resurrection.'},
    {occasion:'Entering the bathroom', ar:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ', translit:'Allahumma inni a\'udhu bika minal khubthi wal khaba\'ith', en:'O Allah, I seek refuge in You from male and female evil and impure spirits.'},
    {occasion:'Leaving the bathroom', ar:'غُفْرَانَكَ', translit:'Ghufranak', en:'I seek Your forgiveness.'},
    {occasion:'Before eating', ar:'بِسْمِ اللَّهِ', translit:'Bismillah', en:'In the name of Allah.'},
    {occasion:'After eating', ar:'الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ', translit:'Alhamdu lillahil-ladhi at\'amana wa saqana wa ja\'alana muslimin', en:'Praise be to Allah who fed us and gave us drink and made us Muslims.'},
    {occasion:'Leaving the house', ar:'بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ', translit:'Bismillahi tawakkaltu \'alallah', en:'In the name of Allah, I place my trust in Allah.'},
    {occasion:'Entering the house', ar:'بِسْمِ اللَّهِ وَلَجْنَا وَبِسْمِ اللَّهِ خَرَجْنَا', translit:'Bismillahi walajna wa bismillahi kharajna', en:'In the name of Allah we enter and in the name of Allah we leave.'},
    {occasion:'Entering the masjid', ar:'اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ', translit:'Allahumma iftah li abwaba rahmatik', en:'O Allah, open the doors of Your mercy for me.'},
    {occasion:'Before wudu', ar:'بِسْمِ اللَّهِ', translit:'Bismillah', en:'In the name of Allah.'},
    {occasion:'Before sleeping', ar:'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا', translit:'Bismika Allahumma amutu wa ahya', en:'In Your name, O Allah, I die and I live.'},
    {occasion:'Seeing something pleasing', ar:'الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ', translit:'Alhamdulillahil-ladhi bi ni\'matihi tatimmus-salihat', en:'Praise be to Allah, by whose grace good deeds are completed.'},
    {occasion:'When it rains', ar:'اللَّهُمَّ صَيِّبًا نَافِعًا', translit:'Allahumma sayyiban nafi\'a', en:'O Allah, let it be a beneficial rain.'}
  ],
  travel: [
    {occasion:'Starting a journey', ar:'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ', translit:'Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrinin, wa inna ila rabbina lamunqalibun', en:'Glory to Him who has subjected this to us, and we could never have accomplished this by ourselves. And indeed, to our Lord we will return.'},
    {occasion:'Entering a new place', ar:'اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا وَخَيْرَ أَهْلِهَا', translit:'Allahumma inni as\'aluka khayraha wa khayra ahliha', en:'O Allah, I ask You for its good and the good of its people.'},
    {occasion:'Boarding a vehicle', ar:'بِسْمِ اللَّهِ وَالْحَمْدُ لِلَّهِ', translit:'Bismillahi wal hamdu lillah', en:'In the name of Allah, and all praise is for Allah.'},
    {occasion:'Returning from a journey', ar:'آيِبُونَ تَائِبُونَ عَابِدُونَ لِرَبِّنَا حَامِدُونَ', translit:'Ayibuna ta\'ibuna \'abiduna li rabbina hamidun', en:'We return, repentant, worshipping, and praising our Lord.'}
  ],
  difficulty: [
    {occasion:'In distress', ar:'حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ', translit:'Hasbunallahu wa ni\'mal wakil', en:'Allah is sufficient for us, and He is the best disposer of affairs.'},
    {occasion:'Facing hardship', ar:'لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ', translit:'La ilaha illa anta subhanaka inni kuntu minaz-zalimin', en:'There is no god but You, glory be to You. Indeed I was among the wrongdoers.'},
    {occasion:'Seeking relief', ar:'اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا', translit:'Allahumma la sahla illa ma ja\'altahu sahla', en:'O Allah, there is no ease except in what You make easy.'},
    {occasion:'Feeling anxious or sad', ar:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ', translit:'Allahumma inni a\'udhu bika minal-hammi wal-hazan', en:'O Allah, I seek refuge in You from anxiety and grief.'},
    {occasion:'Asking for forgiveness', ar:'رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ', translit:'Rabbighfir li wa tub \'alayya innaka antat-tawwabur-rahim', en:'My Lord, forgive me and accept my repentance, You are the Accepter of repentance, the Merciful.'},
    {occasion:'For protection from harm', ar:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ', translit:'Bismillahil-ladhi la yadurru ma\'as-mihi shay\'un fil-ardi wa la fis-sama', en:'In the name of Allah, with whose name nothing on earth or in the heavens can cause harm.'}
  ],
  hadith: [
    {occasion:'On intentions', en:'Actions are judged by intentions, and every person will get the reward according to what he intended.', ar:'إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ', translit:'(Sahih al-Bukhari)'},
    {occasion:'On kindness', en:'Whoever does not show mercy to people, Allah will not show mercy to him.', ar:'مَنْ لَا يَرْحَمِ النَّاسَ لَا يَرْحَمْهُ اللَّهُ', translit:'(Sahih al-Bukhari)'},
    {occasion:'On good character', en:'The best among you are those who have the best manners and character.', ar:'خِيَارُكُمْ أَحَاسِنُكُمْ أَخْلَاقًا', translit:'(Sahih al-Bukhari)'},
    {occasion:'On honesty', en:'Truthfulness leads to righteousness, and righteousness leads to Paradise.', ar:'إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ', translit:'(Sahih al-Bukhari & Muslim)'},
    {occasion:'On neighbours', en:'He is not a believer whose neighbour is not safe from his harm.', ar:'لَا يُؤْمِنُ مَنْ لَا يَأْمَنُ جَارُهُ بَوَائِقَهُ', translit:'(Sahih al-Bukhari)'},
    {occasion:'On smiling', en:'Your smiling in the face of your brother is charity.', ar:'تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ صَدَقَةٌ', translit:'(Jami at-Tirmidhi)'},
    {occasion:'On seeking knowledge', en:'Seeking knowledge is an obligation upon every Muslim.', ar:'طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ', translit:'(Sunan Ibn Majah)'},
    {occasion:'On parents', en:'Paradise lies at the feet of your mother.', ar:'الْجَنَّةُ تَحْتَ أَقْدَامِ الْأُمَّهَاتِ', translit:'(referenced in Sunan an-Nasa\'i)'},
    {occasion:'On patience', en:'How wonderful is the affair of the believer, for all of it is good — if something good happens to him, he is grateful, and that is good for him; and if something bad happens to him, he is patient, and that too is good for him.', ar:'عَجَبًا لِأَمْرِ الْمُؤْمِنِ', translit:'(Sahih Muslim)'},
    {occasion:'On charity', en:'Charity does not decrease wealth.', ar:'مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ', translit:'(Sahih Muslim)'},
    {occasion:'On the tongue', en:'Whoever believes in Allah and the Last Day should speak good or remain silent.', ar:'مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ', translit:'(Sahih al-Bukhari)'},
    {occasion:'On brotherhood', en:'None of you truly believes until he loves for his brother what he loves for himself.', ar:'لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ', translit:'(Sahih al-Bukhari & Muslim)'}
  ]
};
const duaTabLabels = {daily:'Daily', travel:'Travel', difficulty:'Hardship', hadith:'Hadith'};
let activeDuaTab = 'daily';

function renderDuaTabs(){
  const el = document.getElementById('duaTabs');
  el.innerHTML='';
  Object.keys(duaTabLabels).forEach(key=>{
    const btn = document.createElement('button');
    btn.className = 'dua-tab' + (key===activeDuaTab?' active':'');
    btn.textContent = duaTabLabels[key];
    btn.addEventListener('click', ()=>{ activeDuaTab = key; renderDuaTabs(); renderDuaList(); });
    el.appendChild(btn);
  });
}
function renderDuaList(){
  const el = document.getElementById('duaList');
  el.innerHTML = '';
  duaData[activeDuaTab].forEach(d=>{
    const card = document.createElement('div');
    card.className = 'dua-card';
    card.innerHTML = `<div class="dua-occasion">${d.occasion}</div>
      <div class="dua-ar">${d.ar}</div>
      <div class="dua-translit">${d.translit}</div>
      <div class="dua-en">${d.en}</div>`;
    el.appendChild(card);
  });
}
renderDuaTabs();
renderDuaList();
</script>
